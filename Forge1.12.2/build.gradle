plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version "${forge_gradle_version}"
}

version = mod_version
group = mod_id
base.archivesName = mod_name

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mappings_channel, version: mappings_version

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Without this the mod's own classes aren't registered with the dev
            // launch, which is what made the old run config "break with dependencies".
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf( "curse.maven:baubles-${baubles_version}")
    implementation fg.deobf( "curse.maven:mantle-${mantle_version}")

    // compileOnly: optional integrations that can't load in the deobf dev runtime, so they're
    // compiled against but kept off the dev client classpath. Our compat/ code is all
    // Loader.isModLoaded-gated, so compile-time access is enough; the shipped jar is unaffected
    // (production users still get these mods normally). Reasons they break in dev:
    //   - RLCombat needs fermiumbooter+reachfix; the Tinkers addons need tconstruct
    //     -> as `implementation` they tripped FML MissingModsException (error screen).
    //   - JEI crashes in dev with IllegalAccessError on TextureMap.initMissingImage()
    //     (dev-mapping access mismatch); JER depends on JEI, so both are excluded.
    //   - SoManyEnchantments' Mixins (IEntityPlayerMixin) don't apply in this dev runClient,
    //     so every player tick threw ClassCastException in EnchantmentUnsheathing -> crash on
    //     entering a world. Kept compileOnly so the client is runnable for testing.
    compileOnly fg.deobf("curse.maven:somanyenchantments-${somanyenchantments_version}")
    compileOnly fg.deobf( "curse.maven:tinkers-antique-${tinkers_antique_version}")
    compileOnly fg.deobf( "curse.maven:antique-armory-${antique_armory_version}")
    compileOnly fg.deobf("curse.maven:rlcombat-${rlcombat_version}")
    compileOnly fg.deobf( "curse.maven:jei-${jei_version}")
    compileOnly fg.deobf( "curse.maven:jer-${jer_version}")
}

processResources {
    var replaceProperties = [
            'mod_id': mod_id,
            'mod_name': mod_name,
            'version': mod_version,
            'mcversion': minecraft_version,
            'mod_description': mod_description,
            'mod_author': mod_author
    ]

    inputs.properties replaceProperties

    filesMatching('mcmod.info') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Version'  : mod_version,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'ForceLoadAsMod': 'true', //Comment out in dev environment, uncomment for building
        ])
    }
}

jar.finalizedBy('reobfJar')